# 阿里云整站部署示例（CentOS + Nginx）
# 用法：
#   1. 将本文件拷到服务器，例如 /etc/nginx/conf.d/i-doms.conf
#   2. 按实际修改 root、server_name
#   3. nginx -t && systemctl reload nginx
#
# 前置：
#   - 前端已构建到 /opt/i-doms-web/dist（VUE_APP_PUBLIC_PATH=/ npm run build）
#   - agent-proxy 已用 pm2 监听 127.0.0.1:3100

server {
    listen 80;
    server_name 140.249.201.28;  # 有域名时改成域名

    root /opt/i-doms-web/dist;
    index index.html;

    # 泵小智 → 本机 agent-proxy（PAT 不下发前端）
    location /agent-api/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 若后续接真实 MES API，可取消注释并改 upstream
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8081/;
    #     proxy_set_header Host $host;
    #     proxy_set_header Authorization $http_authorization;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
